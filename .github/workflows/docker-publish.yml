name: build & publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hectororviz/glip_move

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # Raíz (/): comportamiento actual, sin cambios.
          - variant: root
            base_path: ""
            sha_prefix: ""
            stable_tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=ref,event=tag
          # Prefijo /move/: misma base de código, compilada con basePath.
          - variant: move
            base_path: /move
            sha_prefix: "move-"
            stable_tags: |
              type=raw,value=move,enable={{is_default_branch}}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            ${{ matrix.stable_tags }}
            type=sha,prefix=${{ matrix.sha_prefix }},format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_BASE_PATH=${{ matrix.base_path }}
            NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          # El VPS Rocky es x86_64. Si aparece ARM, agregar linux/arm64.
          platforms: linux/amd64
